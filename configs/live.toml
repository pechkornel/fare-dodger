# Live (real-time) game: matches of short rounds, each on a different Budapest district, on
# real timetables. Run with `uv run fare-dodger play`. Network keys not listed here use the
# code defaults; each [[district]] below replaces [network.area] with its own polygon.

[network]
# "auto": the Tue/Wed/Thu with the most trips inside the downloaded feed's validity, so the
# server keeps working when BKK publishes a new feed. Set a date ("2026-11-17") to pin it.
service_date = "auto"
window_start = "07:30"
window_end = "09:30"
# RAPTOR's walking transfers use the live game's jogging speed, along streets (detour).
walk_speed_kmh = 10.0
walk_detour_factor = 1.3
# The HÉV suburban trains run in Csepel, Óbuda and Zugló.
modes = ["metro", "tram", "trolleybus", "bus", "suburban_rail"]
station_overrides = "station_overrides.toml"

[network.area]
# Inner Pest (districts VII and VIII, edges of VI and IX): Deák Ferenc tér, Oktogon,
# Keleti pályaudvar, Nagyvárad tér, Boráros tér, Fővám tér, out to the Danube bank.
kind = "polygon"
vertices = [
  [47.5010, 19.0468],
  [47.5122, 19.0597],
  [47.5053, 19.0920],
  [47.4723, 19.1020],
  [47.4756, 19.0636],
  [47.4840, 19.0530],
]

[live]
start_time = "08:00"
duration_minutes = 25
time_scale = 6.0             # timetable seconds per real second (25 min = about 4 real minutes)
ping_every_s = 180           # the Bounty Hunters learn the Dodger's position this often
hunter_extra = 2             # Bounty Hunters = Dodgers + 2 (bots fill the team)
freeze_s = 3.0               # real seconds of countdown before each round
walk_speed_kmh = 10.0        # a brisk jog; walking is along the streets
catch_radius_m = 25.0        # Bounty Hunter on foot this close to an exposed Dodger
sight_radius_m = 100.0       # Bounty Hunters on foot chase a Dodger on foot within this
board_radius_m = 40.0        # stand this close to a stop to wait for a vehicle
min_start_distance_min = 8
# Tickets and fares. Buy a ticket at a stop (T), or ride without one and risk an inspection.
start_money_ft = 1000         # deliver packages to earn more
ticket_price_ft = 450
inspected_share = 0.35       # trips with ticket inspectors aboard (hidden until you board)
fine_ft = 1000               # caught without a ticket
fine_hold_s = 60             # held at the next stop while the fine is processed
jail_s = 30.0                # can't pay it all: taken to the jail, held this many REAL seconds
fine_alerts_hunters = true   # the inspectors report you to the Bounty Hunters
# Packages (the Dodgers only): each goes to a landmark (a statue, monument, museum...) that one
# or two rides reach. Stand at one to see where; E takes it; deliver it for the reward.
packages_waiting = 3
package_reward_ft = 1200
package_radius_m = 25.0
package_min_m = 600.0
package_max_m = 2000.0
# Coffee (the Dodger only): real cafés from OpenStreetMap, a few per district. Press C at one:
# 500 Ft, 3 real seconds standing still, then 20 real seconds running almost as fast as a bus.
cafes_per_district = 4
cafe_radius_m = 25.0
coffee_price_ft = 500
coffee_brew_s = 18           # timetable seconds (3 real seconds at 6x)
coffee_boost_s = 120         # timetable seconds (20 real seconds at 6x)
coffee_speed_kmh = 16.0      # jogging is 10; buses and trams average 15-20
# Match: first to win more than half of the regulation rounds (6 of 10); sides switch at
# halftime; at 5-5, sides switch every round until one team leads by two.
regulation_rounds = 10
start_role = "dodger"
# OpenFreeMap's vector tiles (OpenMapTiles schema, free, no key). The client draws them in its
# own cartoon style, flat when zoomed out, and grows 3D houses from the building footprints
# when zoomed in. Any OpenMapTiles-schema TileJSON works here.
tile_url = "https://tiles.openfreemap.org/planet"
glyphs_url = "https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf"

# Districts, one per round in a shuffled order: a polygon (vertices) or a circle (center and
# radius_m). Water is a wall, so where a district spans the Danube you cross it on a bridge or
# a vehicle. Only the district being played (and the next one) is loaded.
[[district]]
name = "Inner Pest"
vertices = [
