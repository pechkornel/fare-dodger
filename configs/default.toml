# Default Fare Dodger configuration. Every value here is optional; omitted keys use the
# defaults defined in src/fare_dodger/config.py.

[network]
service_date = "auto"        # or "2026-11-04"
window_start = "07:30"       # trips outside this window are dropped at build time
window_end = "11:30"
modes = ["metro", "tram", "trolleybus", "bus"]   # also: "suburban_rail", "ferry"
bus_min_departures_per_hour = 6.0
bus_frequency_window = ["08:00", "09:00"]
include_routes = []
exclude_routes = []
merge_radius_m = 150.0
station_merge_radius_m = 300.0   # same name + one rail platform
walk_radius_m = 400.0
walk_speed_kmh = 5.0
walk_detour_factor = 1.0
change_time_s = 60
metro_change_time_s = 120

[network.area]               # "circle", "bbox" or "polygon"
kind = "circle"
center_lat = 47.4979         # Deák Ferenc tér
center_lon = 19.0544
radius_m = 4500.0

[rules]
start_time = "08:00"
round_minutes = 10
rounds = 12
n_inspectors = 3
reveal_every = 3             # Dodger revealed after rounds 3, 6, 9, 12 (0 = never)
reveal_modes = false         # also reveal the Dodger's modes each round
inspectors_visible = true
catch_on_same_stop = true
catch_on_same_vehicle = true
min_start_distance_min = 20
distinct_inspector_starts = true
