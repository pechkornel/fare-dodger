<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toy Town Models</title>
  <!-- Model sheet for the 3D toy town (world3d.js): people on top, vehicles below, turning
       slowly under the game's light. Open /models.html while the game server runs. -->
  <style>
    html, body { margin: 0; height: 100%; background: #fbf1d6; overflow: hidden;
      font: 600 14px/1.3 "Trebuchet MS", system-ui, sans-serif; color: #2b2118; }
    canvas { display: block; width: 100vw; height: 100vh; }
    p { position: absolute; left: 12px; top: 8px; margin: 0; }
  </style>
</head>
<body>
  <p>Toy town models · drag sideways to turn · <code>?walk=0</code> stands them still</p>
  <canvas id="c"></canvas>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    } }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { makePerson, makeVehicle } from "./world3d.js";

    const walk = new URLSearchParams(location.search).get("walk") !== "0";
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setScissorTest(true);
    const light = (scene) => {
      scene.add(new THREE.AmbientLight(0xffffff, 1.5));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(-38, -57, 73);
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400),
        new THREE.MeshBasicMaterial({ color: "#f7e6c0" }));
      scene.add(ground);
    };

    const people = new THREE.Scene();
    light(people);
    const folks = ["dodger", "wanted", "hunter", "team"].map((kind, i) => {
      const p = makePerson(kind);
      p.root.position.set((i - 1.5) * 2.2, 0, 0);
      p.bubble.visible = i === 2;
      people.add(p.root);
      return p;
    });

    const vehicles = new THREE.Scene();
    light(vehicles);
    let y = 18;
    const fleet = ["bus", "trolleybus", "tram", "metro"].map((mode) => {
      const v = makeVehicle(mode);
      v.root.position.set(0, y, 0);
      y -= 12;
      vehicles.add(v.root);
      return v;
    });

    const camera = (fov) => {
      const c = new THREE.PerspectiveCamera(fov, 1, 0.1, 2000);
      c.up.set(0, 0, 1);
      return c;
    };
    const camPeople = camera(30);
    const camVehicles = camera(35);
    let turn = 0;
    let dragX = null;
    addEventListener("pointerdown", (e) => { dragX = e.clientX; });
    addEventListener("pointerup", () => { dragX = null; });
    addEventListener("pointermove", (e) => {
      if (dragX !== null) { turn += (e.clientX - dragX) * 0.01; dragX = e.clientX; }
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const t = clock.getElapsedTime();
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      const swing = walk ? Math.sin(t * 6) * 0.6 : 0;
      for (const p of folks) {
        p.body.rotation.z = turn + t * 0.4;
        p.legs[0].rotation.y = swing; p.legs[1].rotation.y = -swing;
        p.arms[0].rotation.y = -swing * 0.8; p.arms[1].rotation.y = swing * 0.8;
      }
      for (const v of fleet) v.body.rotation.z = turn * 0.3 + Math.sin(t * 0.3) * 0.5;
      // Seen from the south and above, like the game's camera.
      const view = (scene, cam, x, y0, vw, vh, target, dist) => {
        cam.aspect = vw / vh;
        cam.updateProjectionMatrix();
        cam.position.set(target.x, target.y - dist * 0.75, target.z + dist * 0.66);
        cam.lookAt(target);
        renderer.setViewport(x, y0, vw, vh);
        renderer.setScissor(x, y0, vw, vh);
        renderer.render(scene, cam);
      };
      const wide = w > h;
      if (wide) {
        view(people, camPeople, 0, 0, w * 0.4, h, new THREE.Vector3(0, 0, 1.3), 21);
        view(vehicles, camVehicles, w * 0.4, 0, w * 0.6, h, new THREE.Vector3(0, 0, 0), 75);
      } else {
        view(people, camPeople, 0, h * 0.6, w, h * 0.4, new THREE.Vector3(0, 0, 1.3), 21);
        view(vehicles, camVehicles, 0, 0, w, h * 0.6, new THREE.Vector3(0, 0, 0), 85);
      }
    });
  </script>
</body>
</html>
